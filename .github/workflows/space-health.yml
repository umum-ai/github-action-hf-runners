name: space-health

# Two things at once. `cpu-basic` hardware stops a Space after 48 hours without
# inbound traffic and that timer is not configurable, while a runner's own traffic
# is outbound only — so a Space with nothing but jobs to do would sleep. Reading
# the health endpoint is the inbound traffic that keeps it awake, and a Space that
# has stopped answering is reported here instead of being discovered by a job that
# never starts.
#
# Every Space this organization's CI stands on is read here, and there are two
# kinds: the three long-lived runner Spaces, and the one dispatcher Space that
# turns an `hf-jobs-*` label into a Hugging Face Job. They answer different
# endpoints and are therefore two jobs rather than one matrix.
#
# It uses no credential: the Spaces are public, and so is this repository.

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every Space is reported, not just the first one that fails.
      fail-fast: false
      matrix:
        # The Space host is `<namespace>-<name>.hf.space`. `siam-infra` creates
        # these Spaces and so owns what they are called; this list follows it.
        space:
          - kvokka-siam-gha-runner-1
          - kvokka-siam-gha-runner-2
          - kvokka-siam-gha-runner-3
    steps:
      - name: Read the health endpoint
        env:
          URL: https://${{ matrix.space }}.hf.space/health
        run: |
          set -uo pipefail

          # A Space rebuilding after an apply is briefly unreachable, so a single
          # refusal is not a verdict; five attempts over two minutes is.
          body=""
          status=""
          for attempt in 1 2 3 4 5; do
            body=$(curl -sS --max-time 20 --write-out '\n%{http_code}' "${URL}" 2>&1) || body=""
            status="${body##*$'\n'}"
            if [[ "${status}" == "200" ]]; then
              break
            fi
            echo "attempt ${attempt}: ${URL} -> ${status:-no answer}"
            sleep 30
          done

          payload="${body%$'\n'*}"

          # A Space that cannot take a job answers 503 with a payload that says
          # why, so the payload is read before the status is judged: the reason
          # belongs in the annotation of the failure, which is all a reader of a
          # failed run sees. It is empty when nothing answered at all.
          state=$(printf '%s' "${payload}" | jq -r '.state // empty' 2>/dev/null || true)
          reason=$(printf '%s' "${payload}" | jq -r '.reason // empty' 2>/dev/null || true)

          if [[ "${status}" != "200" ]]; then
            echo "::error title=${{ matrix.space }}::${URL} answered ${status:-nothing} after five attempts${reason:+ — ${state:-unknown}: ${reason}}"
            echo "${payload}" | head -c 500
            exit 1
          fi

          echo "${payload}"

          healthy=$(printf '%s' "${payload}" | jq -r '.healthy // false')
          if [[ "${healthy}" != "true" ]]; then
            echo "::error title=${{ matrix.space }}::the Space answers but reports itself unhealthy${reason:+ — ${state:-unknown}: ${reason}}"
            exit 1
          fi

          taken=$(printf '%s' "${payload}" | jq -r '.jobs_taken')
          revision=$(printf '%s' "${payload}" | jq -r '.image_revision')
          echo "::notice title=${{ matrix.space }}::${state}, ${taken} jobs taken, image ${revision}"

  # The dispatcher is not a runner and holds no runner image: it is the Space
  # GitHub delivers `workflow_job` to, and the only thing that turns an
  # `hf-jobs-*` label into a Hugging Face Job. It sleeps on the same terms as the
  # runners and matters more when it does — a webhook that arrives at a sleeping
  # Space is not what wakes it in time, so the job it announced stays queued
  # until someone reruns the workflow or redelivers the delivery. This read is
  # the inbound traffic that keeps that from happening.
  dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the dispatcher's health endpoint
        env:
          # `<namespace>-<name>.hf.space`, like the runners above. The
          # dispatcher lives in the same personal namespace, because that is the
          # account whose plan may create Spaces.
          URL: https://kvokka-jobs-actions-dispatcher.hf.space/healthz
        run: |
          set -uo pipefail

          # A sleeping Space answers nothing until it has started, and starting
          # is the normal outcome of this request rather than a fault, so the
          # first attempt is given a full minute and four more follow it.
          body=""
          status=""
          for attempt in 1 2 3 4 5; do
            body=$(curl -sS --max-time 60 --write-out '\n%{http_code}' "${URL}" 2>&1) || body=""
            status="${body##*$'\n'}"
            if [[ "${status}" == "200" ]]; then
              break
            fi
            echo "attempt ${attempt}: ${URL} -> ${status:-no answer}"
            sleep 30
          done

          payload="${body%$'\n'*}"

          if [[ "${status}" != "200" ]]; then
            echo "::error title=dispatcher::${URL} answered ${status:-nothing} after five attempts — every job on an hf-jobs-* label stays queued while this is true"
            echo "${payload}" | head -c 500
            exit 1
          fi

          echo "${payload}"

          # `ok` or `needs-config`. The second one is a dispatcher that is up and
          # will still take no work, which is exactly the failure this workflow
          # exists to catch before a job does.
          reported=$(printf '%s' "${payload}" | jq -r '.status // empty')
          if [[ "${reported}" != "ok" ]]; then
            echo "::error title=dispatcher::the Space answers and reports \`${reported:-no status}\` — it dispatches nothing until its GitHub App settings are complete"
            exit 1
          fi

          echo "::notice title=dispatcher::${reported}, awake and configured"
