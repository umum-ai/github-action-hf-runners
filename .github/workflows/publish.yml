name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # GitHub-hosted on purpose: building the image needs a docker daemon, and the
    # HF Jobs runner this repository produces does not have one.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `main` and `v*` tags are the refs that reach GHCR. Every other ref still
      # builds the image and runs the smoke tests, it just keeps the result.
      PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Compute tags
        id: meta
        run: |
          image="ghcr.io/${{ github.repository_owner }}/jobs-actions-runner"
          tags="${image}:latest,${image}:${{ github.sha }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${image}:${GITHUB_REF#refs/tags/}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "smoke_ref=${image}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Into the runner's docker daemon, not to the registry: the image has to
      # pass the smoke tests below before anything is published.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke-test image
        run: ./smoke.sh "${{ steps.meta.outputs.smoke_ref }}"

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the very bytes the smoke tests ran against.
      - name: Push image
        if: env.PUBLISH == 'true'
        run: |
          IFS=',' read -ra refs <<< "${{ steps.meta.outputs.tags }}"
          for ref in "${refs[@]}"; do
            docker push "${ref}"
          done
