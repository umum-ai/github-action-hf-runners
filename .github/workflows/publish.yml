name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile.base, Dockerfile.jobs-actions-runner, Dockerfile.space-runner]
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shell check
        run: shellcheck smoke.sh entrypoint.sh supervisor.sh

      - name: Compile the health server
        run: python3 -m py_compile health-server.py

  images:
    needs: [dockerfiles, scripts]
    # GitHub-hosted on purpose: building an image needs a docker daemon, and no
    # Hugging Face runner this repository produces has one.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # `main` and `v*` tags are the refs that reach GHCR. Every other ref still
      # builds all three images and runs the smoke tests, it just keeps the result.
      PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute the version tag
        id: meta
        run: |
          version=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Into the runner's own docker daemon, not to the registry: an image has to
      # pass its smoke checks before anything is published, and the derived images
      # build `FROM` the base that has just passed them rather than from whatever
      # the registry currently serves.
      - name: Build and smoke-test base
        run: |
          docker build --file Dockerfile.base --tag "${REGISTRY}/base:${GITHUB_SHA}" .
          ./smoke.sh base "${REGISTRY}/base:${GITHUB_SHA}"

      # The name is load-bearing, not cosmetic: the Jobs dispatcher decides whether
      # an image is prebuilt by testing its reference for the literal substring
      # `jobs-actions-runner`, before the container starts. A name carrying it runs
      # `/entrypoint.sh`; any other name makes the dispatcher install a runner
      # inline as root, which this image — running as `runner` — cannot do, and
      # every job in the organization fails on `hf-jobs-cpu-upgrade`. The
      # dispatcher Space is the owner's, so the substring is fixed for us.
      - name: Build and smoke-test jobs-actions-runner
        run: |
          docker build --file Dockerfile.jobs-actions-runner \
            --build-arg "BASE_IMAGE=${REGISTRY}/base:${GITHUB_SHA}" \
            --tag "${REGISTRY}/jobs-actions-runner:${GITHUB_SHA}" .
          ./smoke.sh jobs-actions-runner "${REGISTRY}/jobs-actions-runner:${GITHUB_SHA}"

      - name: Build and smoke-test space-runner
        run: |
          docker build --file Dockerfile.space-runner \
            --build-arg "BASE_IMAGE=${REGISTRY}/base:${GITHUB_SHA}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --tag "${REGISTRY}/space-runner:${GITHUB_SHA}" .
          ./smoke.sh space-runner "${REGISTRY}/space-runner:${GITHUB_SHA}"

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the very bytes the smoke tests ran against: `latest` and the version
      # tag are further names for the image the commit sha already identifies.
      - name: Push images
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for name in base jobs-actions-runner space-runner; do
            built="${REGISTRY}/${name}:${GITHUB_SHA}"
            docker tag "${built}" "${REGISTRY}/${name}:latest"
            docker push "${built}"
            docker push "${REGISTRY}/${name}:latest"
            if [[ -n "${VERSION}" ]]; then
              docker tag "${built}" "${REGISTRY}/${name}:${VERSION}"
              docker push "${REGISTRY}/${name}:${VERSION}"
            fi
          done

      # Hugging Face pulls these images with no credential, and a package name
      # published for the first time is private: a package inherits the access
      # permissions of its linked repository, not its visibility, and GitHub
      # exposes visibility through no API — see "Bootstrap" in the README. So the
      # state is read the way Hugging Face reads it, anonymously, and a private
      # package turns this run red instead of failing inside somebody else's job.
      - name: Prove every package is pullable with no credential
        if: env.PUBLISH == 'true'
        run: |
          private=()
          for name in base jobs-actions-runner space-runner; do
            path="${REGISTRY#ghcr.io/}/${name}"
            # Not `curl -f`: for a package it may not read, the token endpoint
            # answers 403, and that is an answer to report rather than an error to
            # die on. No token leaves the request unauthorized, which is a 401 below.
            token="$(curl -sS --retry 3 --retry-all-errors \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${path}:pull" \
              | jq -r '.token // empty')"
            code="$(curl -sS --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/${path}/tags/list")"
            echo "${path}: ${code}"
            [[ "${code}" == "200" ]] || private+=("${path}")
          done
          if [[ ${#private[@]} -gt 0 ]]; then
            echo "::error::not readable anonymously: ${private[*]} — these packages must be public, and visibility is set on the package itself, once per package name"
            exit 1
          fi
